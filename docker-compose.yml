version: '3.8'

services:
  nexusforge:
    build: .
    ports:
      - "8080:8080"
      - "5000:5000"
    environment:
      - NEXUSFORGE_ENV=production
      - NEXUSFORGE_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
